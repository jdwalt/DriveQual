# SPDX-License-Identifier: Apache-2.0
name: Non-destructive smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bash and regular-file-only tests
        run: bash tests/smoke.sh
